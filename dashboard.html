<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard — SharingSpace</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">SharingSpace</a>
      <nav>
        <a href="index.html">Home</a><a href="explore.html">Explore</a
        ><a href="about.html">About</a>
      </nav>
      <div class="header-actions">
        <a class="write-link" href="create-post.html">Write</a
        ><button
          class="signin"
          id="logoutButton"
          type="button"
          style="border: 0; background: none; cursor: pointer"
        >
          Exit
        </button>
      </div>
    </header>
    <main class="dashboard">
      <aside class="sidebar">
        <p class="eyebrow">WRITER</p>
        <h3>Aung Kha</h3>
        <a class="side-active" href="dashboard.html">Dashboard</a
        ><a href="posts.html">My posts</a
        ><a href="create-post.html">Create post</a
        ><a href="about.html">About</a>
      </aside>
      <section class="dash-main">
        <div class="dash-title">
          <div>
            <p class="eyebrow">YOUR WRITING</p>
            <h1>Dashboard</h1>
          </div>
          <a class="button button-dark" href="create-post.html">+ New post</a>
        </div>
        <div class="stats">
          <div>
            <span>Published</span><strong id="publishedCount">0</strong>
          </div>
          <div><span>Drafts</span><strong>1</strong></div>
          <div><span>Total views</span><strong>—</strong></div>
          <div><span>Followers</span><strong>—</strong></div>
        </div>
        <div class="dash-section">
          <div class="section-heading">
            <h2>Recent posts</h2>
            <a href="posts.html">View all →</a>
          </div>
          <div class="table">
            <div class="table-head">
              <span>Title</span><span>Status</span><span>Views</span
              ><span>Action</span>
            </div>
            <div id="dashboardPosts"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
