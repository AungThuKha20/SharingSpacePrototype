<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Explore — SharingSpace</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">SharingSpace</a>
      <nav>
        <a href="index.html">Home</a
        ><a class="active" href="explore.html">Explore</a
        ><a href="about.html">About</a>
      </nav>
      <div class="header-actions">
        <a class="write-link" data-write-link href="create-post.html">Post</a
        ><a class="signin" id="signinLink" href="login.html">Sign in</a
        ><a
          class="signin"
          id="dashboardLink"
          href="dashboard.html"
          style="display: none"
          >Dashboard</a
        ><button
          class="signin"
          id="logoutButton"
          type="button"
          style="display: none; border: 0; background: none; cursor: pointer"
        >
          Exit
        </button>
      </div>
    </header>
    <main class="page">
      <div class="page-intro">
        <p class="eyebrow">EXPLORE</p>
        <h1>Find something<br />worth reading.</h1>
        <div class="search-box">
          <input
            id="searchInput"
            type="search"
            placeholder="Search articles..."
          />
        </div>
      </div>
      <div class="filter-bar">
        <button class="filter active" data-filter="all">All</button
        ><button class="filter" data-filter="programming">Programming</button
        ><button class="filter" data-filter="data engineering">
          Data Engineering</button
        ><button class="filter" data-filter="cybersecurity">
          Cybersecurity</button
        ><button class="filter" data-filter="ai">AI</button>
      </div>
      <div id="explorePosts" class="post-list"></div>
    </main>
    <footer class="site-footer">
      <span>© 2026 SharingSpace</span><span>Student publishing prototype</span>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
