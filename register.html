<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account — SharingSpace</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <a class="logo" href="index.html">SharingSpace</a>
      <div class="auth-card">
        <p class="eyebrow">JOIN SHARINGSPACE</p>
        <h1>Create account</h1>
        <p>Create a local prototype account and start publishing.</p>
        <form id="registerForm">
          <label>Name<input required placeholder="Your name" /></label
          ><label
            >Email<input
              type="email"
              required
              placeholder="you@example.com" /></label
          ><label
            >Password<input
              id="registerPassword"
              type="password"
              required
              placeholder="Create a password" /></label
          ><label
            >Password confirmation<input
              id="registerConfirm"
              type="password"
              required
              placeholder="Repeat password" /></label
          ><button class="button button-dark full" type="submit">
            Create account
          </button>
        </form>
        <p class="auth-bottom">
          Already registered? <a href="login.html">Sign in</a>
        </p>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
