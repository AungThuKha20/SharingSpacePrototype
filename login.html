<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — SharingSpace</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <a class="logo" href="index.html">SharingSpace</a>
      <div class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in</h1>
        <p>Continue writing and reading with SharingSpace.</p>
        <form id="loginForm">
          <label
            >Email<input
              id="loginEmail"
              type="email"
              required
              placeholder="you@example.com" /></label
          ><label
            >Password<input
              id="loginPassword"
              type="password"
              required
              placeholder="••••••••" /></label
          ><label class="check"><input type="checkbox" /> Remember me</label
          ><button class="button button-dark full" type="submit">
            Sign in
          </button>
          
        </form>
        <p class="auth-bottom">
          New here? <a href="register.html">Create an account</a>
        </p>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
